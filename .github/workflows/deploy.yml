name: Publish Gemini branch preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the training branch
        uses: actions/checkout@v4
        with:
          repository: yusheng266186-beep/jianwei-observatory
          ref: feature/gemini-training
          path: source
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static frontend only
        shell: bash
        run: |
          set -euo pipefail
          mkdir public
          cp source/index.html source/model-workbench.html source/figure-library.html source/styles.css public/
          cp -R source/app source/assets source/styles source/vendor public/
          touch public/.nojekyll
          python3 - <<'PY'
          import json, pathlib, subprocess
          commit = subprocess.check_output(['git', '-C', 'source', 'rev-parse', 'HEAD'], text=True).strip()
          pathlib.Path('public/preview-build.json').write_text(json.dumps({
              'repository': 'yusheng266186-beep/jianwei-observatory',
              'branch': 'feature/gemini-training',
              'commit': commit,
              'storageScope': 'gemini-preview'
          }))
          PY
      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
